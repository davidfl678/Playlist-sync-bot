name: Synchronize music playlists

on:
  schedule:
    # GitHub Actions cron is UTC. Run at 00:00, 06:00, 12:00, and 18:00 UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never allow two jobs to update the same history/target playlists concurrently.
concurrency:
  group: playlist-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: YouTube to music platforms
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Every expression below uses the exact GitHub Actions Secret name.
      # YOUTUBE_API_KEY is optional unless the primary yt-dlp source fails.
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YT_PLAYLIST_ID: ${{ secrets.YT_PLAYLIST_ID }}

      SPOTIFY_SP_DC: ${{ secrets.SPOTIFY_SP_DC }}
      SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}

      SOUNDCLOUD_OAUTH_TOKEN: ${{ secrets.SOUNDCLOUD_OAUTH_TOKEN }}
      SOUNDCLOUD_PLAYLIST_ID: ${{ secrets.SOUNDCLOUD_PLAYLIST_ID }}

      AUDIOMACK_TOKEN: ${{ secrets.AUDIOMACK_TOKEN }}
      AUDIOMACK_PLAYLIST_ID: ${{ secrets.AUDIOMACK_PLAYLIST_ID }}
      AUDIOMACK_TOKEN_SECRET: ${{ secrets.AUDIOMACK_TOKEN_SECRET }}
      AUDIOMACK_CONSUMER_KEY: ${{ secrets.AUDIOMACK_CONSUMER_KEY }}
      AUDIOMACK_CONSUMER_SECRET: ${{ secrets.AUDIOMACK_CONSUMER_SECRET }}

      DEEZER_ARL: ${{ secrets.DEEZER_ARL }}
      DEEZER_PLAYLIST_ID: ${{ secrets.DEEZER_PLAYLIST_ID }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Only positions 51+ are eligible by default, as requested.
      YT_START_INDEX: "51"
      API_DELAY_SECONDS: "2"
      MATCH_THRESHOLD: "78"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A unique key makes every successful save immutable; restore-keys picks
      # the newest preceding run. The committed copy below is the durable
      # fallback if GitHub evicts a cache entry.
      - name: Restore synchronization history cache
        id: history-restore
        uses: actions/cache/restore@v4
        with:
          path: synced_history.json
          key: synced-history-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            synced-history-${{ github.repository_id }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Run playlist synchronizer
        run: python sync.py

      # Save partial per-platform checkpoints even when a fatal source error
      # makes the main step fail. hashFiles prevents saving a nonexistent file.
      - name: Save synchronization history cache
        if: ${{ always() && hashFiles('synced_history.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: synced_history.json
          key: synced-history-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Cache storage is not permanent. Committing the small state file gives a
      # durable source of truth and still satisfies manual/scheduled runs when
      # the cache is unavailable.
      - name: Commit updated synchronization history
        if: ${{ always() && hashFiles('synced_history.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- synced_history.json

          if git diff --cached --quiet; then
            echo "Synchronization history is unchanged."
            exit 0
          fi

          git commit -m "chore(sync): update playlist history [skip ci]"

          # Concurrency makes a race unlikely; rebase/retry still protects a
          # manual run if the branch changed while synchronization was running.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing before retry."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done

          echo "Unable to persist synced_history.json after three attempts." >&2
          exit 1
